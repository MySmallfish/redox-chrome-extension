name: Release package

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release merged PR package
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Package extension
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACKAGE_BUILD_NUMBER: ${{ github.run_number }}
          REDOX_SECURITY_CODE_API_KEY: ${{ vars.REDOX_SECURITY_CODE_API_KEY }}
          REDOX_TOKEN_API_KEY: ${{ vars.REDOX_TOKEN_API_KEY }}
        run: pnpm run package -- --out artifacts

      - name: Read package metadata
        id: package
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const info = JSON.parse(fs.readFileSync("artifacts/package-info.json", "utf8"));
          console.log(`version=${info.version}`);
          console.log(`zip_path=${info.zipPath}`);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_ZIP: ${{ steps.package.outputs.zip_path }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          tag="v${PACKAGE_VERSION}"
          title="Redox Chrome Extension ${PACKAGE_VERSION}"
          notes_file="$(mktemp)"
          {
            echo "Packaged from merged PR #${PR_NUMBER}: ${PR_TITLE}"
            echo ""
            echo "Target branch: ${BASE_BRANCH}"
            echo "Commit: $(git rev-parse HEAD)"
          } > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE_ZIP" artifacts/package-info.json --clobber
          else
            gh release create "$tag" "$PACKAGE_ZIP" artifacts/package-info.json \
              --target "$(git rev-parse HEAD)" \
              --title "$title" \
              --notes-file "$notes_file"
          fi

  deploy-chrome-store:
    name: Deploy to Chrome Web Store
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
    needs: release
    runs-on: ubuntu-latest
    environment: store

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACKAGE_BUILD_NUMBER: ${{ github.run_number }}
          REDOX_SECURITY_CODE_API_KEY: ${{ vars.REDOX_SECURITY_CODE_API_KEY || secrets.REDOX_SECURITY_CODE_API_KEY }}
          REDOX_TOKEN_API_KEY: ${{ vars.REDOX_TOKEN_API_KEY || secrets.REDOX_TOKEN_API_KEY }}
        run: pnpm run package -- --out artifacts

      - name: Read package metadata
        id: package
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const info = JSON.parse(fs.readFileSync("artifacts/package-info.json", "utf8"));
          console.log(`zip_path=${info.zipPath}`);
          NODE

      - name: Deploy to Chrome Web Store
        env:
          PACKAGE_ZIP: ${{ steps.package.outputs.zip_path }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID || secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID || secrets.CHROME_EXTENSION_ID }}
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
        run: pnpm run deploy:chrome-store -- --zip "$PACKAGE_ZIP"
