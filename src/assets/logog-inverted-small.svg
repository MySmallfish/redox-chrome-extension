<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <style>
      /* --- INVERTED THEME --- */
      /* Background color used for masking pen */
      .bg-color-fill { fill: #00AEEF; }
      
      /* Foreground color (White) for strokes and solid fills */
      .fg-stroke {
        fill: none;
        stroke: #FFFFFF;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fg-fill { fill: #FFFFFF; stroke: none; }

      /* Specific line weights */
      .thick { stroke-width: 18; }
      .thin { stroke-width: 9; }
      .pen-outline { stroke-width: 4; stroke-linecap: butt; }
      .pen-detail { stroke-width: 3; }
      
      /* Pen Masking (Must match background color to hide lines) */
      .pen-gap-mask {
        fill: #00AEEF;
        stroke: #00AEEF;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="#00AEEF"></rect>

  <g transform="translate(20, 40)">
      <path class="fg-stroke thick" d="
        M 210,270 L 210,50 
        L 80,50 Q 40,50 40,90 
        L 40,230 Q 40,270 80,270 
        L 150,270
      "></path>
      
      <path class="fg-stroke thick" d="
        M 210,50 
        Q 320,50 320,120 
        Q 320,190 210,190
        M 245,190 
        L 330,270
      "></path>

      <line class="fg-stroke thin" x1="80" y1="100" x2="140" y2="100"></line>
      <line class="fg-stroke thin" x1="80" y1="150" x2="125" y2="150"></line>
      <line class="fg-stroke thin" x1="80" y1="200" x2="100" y2="200"></line>

      <path class="fg-stroke" stroke-width="7" d="M 60,235 Q 80,220 100,235 T 140,235"></path>


      <g transform="translate(135, 175) rotate(45)">
        
        <path class="pen-gap-mask" d="M -11,45 L -11,-60 A 11,11 0 0 1 11,-60 L 11,45"></path>
        <path class="pen-gap-mask" d="M -13,45 Q 0,80 0,80 Q 0,80 13,45 Z"></path>

        <path class="fg-stroke pen-outline bg-color-fill" d="
          M -11,45 
          L -11,-60 
          A 11,11 0 0 1 11,-60 
          L 11,45
        "></path>
        
        <path class="fg-fill" d="
          M -13,45 
          Q 0,80 0,80 
          Q 0,80 13,45 
          Z
        "></path>
        
        <rect x="-5" y="-50" width="10" height="30" rx="2" class="fg-stroke pen-detail"></rect>
      </g>
  </g>
</svg>